title: Mohammad Hasan Sharifian
first_name: Mohammad Hasan
last_name: Sharifian

description: >
  PhD Candidate in Social Psychology at the University of Michigan.
  Research on culture, honor, and intergroup conflict.

url: https://hasansharifian.github.io
baseurl: ""

lang: en
icon: ⚛️

navbar_fixed: true
footer_fixed: true
search_enabled: true
bib_search: true
max_width: 930px

# -----------------------------------------------------------------------------
# Social Links (REQUIRED if navbar social is enabled)
# -----------------------------------------------------------------------------

enable_navbar_social: true

social:
  github: hasansharifian
  linkedin: your-linkedin-id
  google_scholar: your-google-scholar-id

# -----------------------------------------------------------------------------
# Blog (disable demo sources)
# -----------------------------------------------------------------------------

external_sources: []

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  books:
    output: true
  news:
    output: true
  projects:
    output: true
  teachings:
    output: true

# -----------------------------------------------------------------------------
# Scholar Configuration (THIS REPLACES EINSTEIN)
# -----------------------------------------------------------------------------

scholar:
  last_name: [Sharifian]
  first_name: [Mohammad, MohammadHasan, Hasan]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib

  query: "@*"
  group_by: year
  group_order: descending

enable_publication_badges:
  altmetric: false
  dimensions: false
  google_scholar: false
  inspirehep: false

enable_publication_thumbnails: true

# -----------------------------------------------------------------------------
# Markdown
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll/scholar
  - jekyll-socials

# -----------------------------------------------------------------------------
# Footer
